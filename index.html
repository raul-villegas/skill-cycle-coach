<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Skill Cycle · DU · BMU · HSW · Rope</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#14181f;--mu:#6b7280;--ac:#0f766e;--ln:#e3e6ea;--hd:#0f2a43;--wn:#b45309;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f1318;--card:#181e26;--tx:#e8ebef;--mu:#8b94a0;--ac:#2dd4bf;--ln:#2a323d;--hd:#1e3a57;--wn:#fbbf24}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f1318;--card:#181e26;--tx:#e8ebef;--mu:#8b94a0;--ac:#2dd4bf;--ln:#2a323d;--hd:#1e3a57;--wn:#fbbf24}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 -apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding-bottom:84px}
main{max-width:640px;margin:0 auto;padding:14px}
h1{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);margin:4px 0 10px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:12px}
.blk{background:var(--hd);color:#fff;border-radius:10px;padding:9px 12px;font-weight:700;margin:6px 0 10px}
.lb{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);margin:10px 0 3px}
.tx{white-space:pre-line}.main{font-size:18px;font-weight:600}
.wn{color:var(--wn);font-weight:600}
.chip{display:inline-block;font-size:12px;border:1px solid var(--ln);border-radius:99px;padding:2px 9px;color:var(--mu);margin-right:4px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
button,select,input,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:9px 12px}
button{cursor:pointer}button.p{background:var(--ac);color:#fff;border:0;font-weight:700;width:100%;padding:12px}
button.dn{background:transparent;color:var(--ac);border-color:var(--ac)}
textarea{width:100%;min-height:70px;resize:vertical}
label{display:block;font-weight:600;margin-top:12px}small{color:var(--mu);display:block;font-weight:400}
input,select{width:100%;margin-top:4px}
.wk{font-size:12px;font-weight:700;color:var(--mu);margin:14px 2px 6px;text-transform:uppercase}
.li{display:flex;justify-content:space-between;gap:8px;padding:11px 12px;border:1px solid var(--ln);background:var(--card);border-radius:12px;margin-bottom:6px;cursor:pointer}
.li.cur{border-color:var(--ac)}.li.d{opacity:.55}
.li span:first-child{min-width:0}.li span:last-child{flex:none}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;border-radius:0;background:none;padding:14px 4px;color:var(--mu);font-weight:600}
nav button.on{color:var(--ac)}
#tc{font-size:44px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.sc{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button,select,input,textarea{min-height:44px}
.li{overflow-wrap:anywhere}
@media print{
 body{padding:0;background:#fff;color:#111}
 #tmw,nav,button{display:none!important}
 main{max-width:none;padding:0}
 .card,.li{break-inside:avoid;background:#fff;color:#111;border-color:#bbb}
 .blk{print-color-adjust:exact;-webkit-print-color-adjust:exact}
}
</style></head><body><main id="v"></main>
<main id="tmw" style="padding-top:0"><details class="card" id="tm"><summary><b>EMOM / interval timer</b></summary>
<label>Minutes<input id="tmin" type="number" value="10" min="1" max="30" inputmode="numeric"></label>
<div id="tc">00:00</div><div id="tl" class="lb" style="text-align:center">Ready</div>
<div class="sc" style="margin-top:8px"><button class="p" id="tgo">Start</button><button id="trs">Reset</button></div></details></main>
<nav id="nv"></nav>
<script>
const $=s=>document.querySelector(s);
const defaultStart="2026-10-30";
let S={startDate:defaultStart,inp:{M:"",b:"",bt:"A",ht:"1",rope:""},done:{},notes:{},res:{}};
try{const x=JSON.parse(localStorage.getItem("cfsc")||"{}");S={...S,...x,inp:{...S.inp,...(x.inp||{})}}}catch(e){}
const save=()=>{try{localStorage.setItem("cfsc",JSON.stringify(S))}catch(e){}};
const esc=x=>String(x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const validDate=x=>typeof x=="string"&&/^\d{4}-\d{2}-\d{2}$/.test(x)&&!Number.isNaN(Date.parse(x+"T00:00:00Z"))&&new Date(x+"T00:00:00Z").toISOString().slice(0,10)==x;
const WF="2 min easy single unders\n2 rounds: 10 scap pull-ups · 10 band pull-aparts · 5 thoracic cat-cows\n2 × (20 s hollow + 20 s arch hold)\n2 × 15 pogo hops";
const WT="90 s wrist & finger prep\n2 min easy bike or row\n2 rounds: 5 pike push-ups · 10 shoulder dislocates · 20 s wall hollow hold · 10 scap pull-ups\n2 × 20 s dead hang";
const COOL="1 min lat stretch\n1 min wrist & forearm release";
const DUD="3 × :20 pogo jumps (no rope)\n2 × :30 fast singles (wrists only)";
const KS="Kip swings 3 × 10 (hollow to arch)\nButterfly “bicycle” rhythm, no pull: 3 × :20\nStraight-bar dips 3 × 5";
const TS=[["Double unders","Test · Flight Simulator",DUD,"FLIGHT SIMULATOR for time\nUnbroken DU sets: 5-10-15...45-50-45...15-10-5\nRest as needed; if you trip, restart that set. Cap ≈ 8 min.","Record: time (or highest round completed). M = largest unbroken set → enter it in Inputs."],
["Bar muscle-ups","Test · BMU AMRAP 5","3 × 3 kip swings\n3 × 2 jumping pull-ups","AMRAP 5 min of ONE movement: bar muscle-ups, chest-to-bar or pull-ups.\nUse the same movement at the retest.","Record: total reps + movement. b = biggest unbroken set → Inputs.\nTrack A = under ~10 reps / no solid kipping C2B · B = 10+ C2B, no BMU · C = have BMUs"],
["Handstand walk","Test · HSW AMRAP 5","2 × :20 wall holds\n3 kick-ups","AMRAP 5 min\n1 rep = 5 m handstand walk (or 1 wall walk if you can’t walk yet)","Record: total reps + longest unbroken distance.\nTrack 1 = wall walks · 2 = freestanding hold · 3 = walks 5 m+ → Inputs."],
["Rope climbs","Test · 10 climbs for time","3 × foot-lock on the floor\n2 half-height climbs","10 rope climbs for time\nNote rope height and technique (J-hook / S-wrap).","Record: total time + rope height. Enter seconds in Inputs."]];
const BS={3:"Banded strict pull-ups 4 × 5, 3 s lowering\nBand that allows 6–8 strict reps. Note it: ____",4:"Banded strict pull-ups 4 × 6, 3 s lowering\nSame band",5:"Banded strict pull-ups 4 × 6\nMove to a THINNER band",6:"Banded strict pull-ups 4 × 5\nSame band as wk 5",7:"Deload: banded pull-ups 3 × 5, easy",8:"Banded strict pull-ups 5 × 4\nMove to a THINNER band",9:"Banded strict pull-ups 5 × 4\nSame band",10:"Banded strict pull-ups 5 × 4\nTHINNER band (or band-free)",11:"Strict pull-ups 4 × 5\nBand-free? Add 2.5–5 kg or slow the lowering to 5 s",12:"Taper: strict pull-ups 3 × 4, easy"};
const HS={3:["Wall-facing hold 2:00 total (sets of :20–:30)\n5 wall walks","Wall hold 2:00 total\n3 × 3 kick-ups (practice bailing)","Wall hold 2:00 total\n3 × 3 kick-ups\n4 × 3 m walk, small steps"],
4:["Wall hold 3:00 total\n6 wall walks","Wall hold 3:00 total\n4 × 3 weight shifts","Wall hold 3:00 total\n4 × 3 shifts\n5 × 4 m walk"],
5:["Wall hold 3:00 total\n8 wall walks","Wall hold 3:00 total\n4 × 5 steps","Wall hold 3:00 total\n5 × 5 m walk"],
6:["Wall hold 4:00 total\n3 × 6 wall walks","Wall hold 4:00 total\n5 × 6 steps","Wall hold 4:00 total\n5 × 8 m walk"],
7:["Deload: wall hold 2:00\n4 easy wall walks","Deload: wall hold 2:00\n4 easy kick-ups","Deload: wall hold 2:00\n4 × 3 m easy"],
8:["EMOM 10: 1 wall walk","EMOM 10: 5 steps","EMOM 10: 5 m walk"],
9:["5 × 1 wall walk, 5 s hold at top\nRest 60 s","5 × 8 steps, rest 60 s","5 × 10 m walk, rest 60 s"],
10:["EMOM 10: 2 wall walks","EMOM 10: 8 steps","EMOM 10: 6 m (2 × 3 m)"],
11:["5 wall walks, 20 s hold at top","4 × 10 steps, rest 60 s","4 × 10 m walk, rest 60 s"],
12:["Taper: 3 easy wall walks","Taper: 3 × 5 steps","Taper: 3 × 5 m walk"]};
const RP={3:"4 × 1 climb to halfway",4:"5 × 1 climb to halfway",5:"4 × 1 full climb",6:"5 × 1 full climb",7:"Deload: 3 × 1 half climb",8:"EMOM 8: 1 full climb",9:"5 full climbs for time",10:"EMOM 10: 1 full climb",12:"Taper: 4 full climbs, rest as needed"};
const NM="⚠ Enter M in Inputs after the double-under test",NB="⚠ Enter b in Inputs after the bar muscle-up test";
const ph=w=>w<3?"Baseline test":w<7?"Foundation":w==7?"Deload":w<12?"Build":w==12?"Taper":"Retest";
function build(w,d){
 const I=S.inp,M=+I.M,b=+I.b,q=p=>Math.max(3,Math.round(M*p)),bq=p=>Math.max(2,Math.round(b*p));
 if(w<3||w>12){const x=TS[(w<3?w-1:w-13)*2+d];return{focus:(w>12?"Retest · ":"Test · ")+x[0],warm:d?WT:WF,bl:[{n:x[1],dr:x[2],m:x[3],ex:x[4]+(w>12?"\nCompare with your baseline in Results.":"")}]}}
 if(!d){
  const du={3:()=>`EMOM 10: ${q(.5)} unbroken DU each minute (50% of M)`,4:()=>`EMOM 10: ${q(.55)} DU each minute (55% of M)`,5:()=>`EMOM 12: ${q(.55)} DU each minute (55% of M)`,6:()=>`EMOM 12: ${q(.6)} DU each minute (60% of M)`,7:()=>`Deload: 6 sets of ${q(.4)} DU (40% of M)\nRest 45 s`,8:()=>`5 sets of ${q(.7)} DU (70% of M), rest 30 s\nThen 1 max-effort set: note how many`,9:()=>`Ladder for time: 10-20-30… up to ${Math.max(10,Math.round(M*.7/10)*10)} and back down (≈70% of M)\nUnbroken sets, rest as needed`,10:()=>`EMOM 10: ${q(.75)} DU (75% of M)\nThen 3 × :20 crisp singles`,11:()=>`Mini Flight Simulator for time: 5-10-15… up to ${Math.max(10,Math.round(M*.8/5)*5)} and back down (≈80% of M)`,12:()=>`Taper: 3 sets of ${q(.7)} DU (70% of M), rest 1 min`}[w];
  const C={3:"EMOM 8: 1 BMU",4:"EMOM 8: 1 BMU",5:"EMOM 10: 1–2 BMU",6:"EMOM 10: 1–2 BMU",7:"Deload: EMOM 6, 1 BMU",8:"EMOM 10: 2 BMU",9:"EMOM 10: 2 BMU",10:"4 × 3 BMU, rest 90 s",11:"3 × 3–4 BMU, rest 2 min",12:"Taper: 2 × 2 BMU"}[w];
  const tr={5:.55,6:.6,8:.65,9:.7}[w],ab={3:`EMOM 8: ${bq(.5)} C2B (50% of b)`,4:`EMOM 8: ${bq(.55)} C2B (55% of b)`,7:`Deload: EMOM 6, ${bq(.4)} C2B`,10:`4 × ${bq(.8)} C2B (80% of b), rest 90 s`,11:`3 × ${bq(.9)} C2B (90% of b), rest 2 min`,12:`Taper: 2 × ${bq(.7)} C2B`}[w]||`EMOM 10\nOdd min: 2 jumping or banded BMU\nEven min: ${bq(tr)} C2B`+(w==9?"\nLast 3 min: try 1 full kipping BMU per minute":"");
  const bd=w%2?(I.bt=="A"?KS:"Jumping BMU on low bar 3 × 3\nBand-assisted BMU 3 × 2\nEccentric BMU 3 × 2 (lower slowly)"):KS;
  return{focus:"Double unders + Bar muscle-ups",warm:WF,bl:[
   {n:"1 · Double unders (12 min)",dr:DUD,m:!M?NM:M<10?"Low-M plan: 6 rounds of 10 singles + 2–3 DU attempts + 10 singles. Goal: string 5+.":du(),ex:"Rest days: 3–5 min easy DU on 2–3 days"},
   {n:"2 · Bar muscle-ups / C2B (18 min)",dr:bd,m:I.bt=="C"?C:!b?NB:ab,ex:BS[w]}]}}
 const pace=+I.rope/10,rm=w==11?`8 full climbs for time (${pace?"target under "+Math.floor(pace*8/60)+":"+String(Math.round(pace*8%60)).padStart(2,"0"):"beat your test pace"})`:RP[w];
 return{focus:"Handstand walk + Rope climbs",warm:WT,bl:[
  {n:"1 · Handstand walk (14 min)",dr:["Wall-facing holds\nShoulder taps at wall 3 × 6/side","Shoulder taps at wall 3 × 6/side\nKick-up & bail practice 3 × 3","Weight shifts 3 × 5/side\nHand-to-hand steps on wall 3 × 5"][I.ht-1],m:HS[w][I.ht-1],ex:"Wall hollow hold "+(w==7||w==12?2:3)+" × :20"},
  {n:"2 · Rope climbs (14 min)",dr:"Foot-lock on the floor 3 × 5\n"+(w%2?"Seated rope pulls 3 × 5":"Jump-and-clamp to hip height 3 × 3"),m:rm+"\nControlled descents",ex:[3,4,5,6,8,9,10].includes(w)?"Towel pull-ups 3 × 3 (grip). Keep easy; tape if skin tears":"—"}]}}
function makeSessions(){const ses=[],start=validDate(S.startDate)?S.startDate:defaultStart,[y,m,d]=start.split("-").map(Number),base=Date.UTC(y,m-1,d);
 for(let w=1;w<=14;w++)for(const d of[0,1]){const ms=base+864e5*(7*(w-1)+4*d);ses.push({w,d,ms,date:new Date(ms).toISOString().slice(0,10),id:w+(d?"T":"F")})}
 return ses}
let ses=makeSessions();
const fmt=ms=>new Date(ms).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short",timeZone:"UTC"});
const td=()=>{const n=new Date();return n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0")+"-"+String(n.getDate()).padStart(2,"0")};
function currentSession(){const i=ses.findIndex(s=>s.date>=td());return i<0?27:Math.max(0,i)}
let cur=currentSession();
let tab="t";
const tabs=[["t","Today"],["c","Calendar"],["i","Inputs"],["r","Results"]];
function nav(){$("#nv").innerHTML=tabs.map(([k,l])=>`<button class="${tab==k?"on":""}" data-k="${k}">${l}</button>`).join("");
 $("#nv").querySelectorAll("button").forEach(b=>b.onclick=()=>{tab=b.dataset.k;draw()});}
function draw(){nav();$("#tmw").style.display=tab=="t"?"":"none";window.scrollTo(0,0);({t:today,c:cal,i:inputs,r:results})[tab]()}
function today(){
 const s=ses[cur],x=build(s.w,s.d),dn=S.done[s.id];
 $("#v").innerHTML=`<div class="row"><button id="pv" ${cur?"":"disabled"}>←</button><h1 style="margin:0;text-align:center">${fmt(s.ms)} · Week ${s.w}</h1><button id="nx" ${cur<27?"":"disabled"}>→</button></div>
 <div style="margin:10px 0"><span class="chip">${ph(s.w)}</span><span class="chip">${x.focus}</span>${dn?'<span class="chip">✔ done</span>':""}</div>
 <div class="card"><div class="lb" style="margin-top:0">Warm-up · 8 min</div><div class="tx">${x.warm}</div></div>
 ${x.bl.map(k=>`<div class="card"><div class="blk">${k.n}</div><div class="lb">Drills</div><div class="tx">${k.dr}</div><div class="lb">Main set</div><div class="tx main ${k.m[0]=="⚠"?"wn":""}">${k.m}</div><div class="lb">Strength / record</div><div class="tx">${k.ex}</div></div>`).join("")}
 <div class="card"><div class="lb" style="margin-top:0">Cooldown</div><div class="tx">${COOL}</div></div>
 <div class="card"><div class="lb" style="margin-top:0">Your result / notes</div><textarea id="nt" placeholder="Reps, times, band used, how it felt…"></textarea></div>
 <button class="p" id="dn">${dn?"Mark as not done":"Mark session done ✔"}</button>`;
 $("#nt").value=S.notes[s.id]||"";$("#nt").oninput=e=>{S.notes[s.id]=e.target.value;save()};
 $("#dn").onclick=()=>{S.done[s.id]=!S.done[s.id];save();today()};
 $("#pv").onclick=()=>{cur--;today();window.scrollTo(0,0)};$("#nx").onclick=()=>{cur++;today();window.scrollTo(0,0)};}
function cal(){let h="<h1>Calendar</h1>",lw=0;
 ses.forEach((s,i)=>{if(s.w!=lw){lw=s.w;h+=`<div class="wk">Week ${s.w} · ${ph(s.w)}</div>`}
  h+=`<div class="li ${i==cur?"cur":""} ${S.done[s.id]?"d":""}" data-i="${i}"><span><b>${fmt(s.ms)}</b> · ${build(s.w,s.d).focus}</span><span>${S.done[s.id]?"✔":""}</span></div>`});
 $("#v").innerHTML=h;document.querySelectorAll(".li").forEach(e=>e.onclick=()=>{cur=+e.dataset.i;tab="t";draw()})}
function inputs(){const I=S.inp,f=(k,l,h,t="number")=>`<label>${l}<small>${h}</small><input data-k="${k}" type="${t}" inputmode="decimal" value="${esc(I[k])}"></label>`;
 $("#v").innerHTML=`<h1>Inputs</h1><div class="card">Enter these after each test. Your numbers update automatically in every session.
 ${f("M","Double unders · M","Largest unbroken set in the Flight Simulator")}${f("b","Bar muscle-ups / C2B · b","Biggest unbroken set in the AMRAP 5")}
 <label>Bar muscle-up track<small>A: under ~10 reps or no solid kipping C2B · B: 10+ C2B, no BMU · C: you have BMUs</small><select data-k="bt">${["A","B","C"].map(o=>`<option ${I.bt==o?"selected":""}>${o}</option>`).join("")}</select></label>
 <label>Handstand walk track<small>1: wall walks only · 2: freestanding hold · 3: walks 5 m+</small><select data-k="ht">${[1,2,3].map(o=>`<option ${I.ht==o?"selected":""}>${o}</option>`).join("")}</select></label>
 ${f("rope","Rope test · total seconds","Time for 10 climbs, in seconds (e.g. 420)")}</div>
 <div class="card"><b>Plan setup &amp; progress</b><small>Choose the first training date. The page saves progress in this browser when supported. Export the JSON file for a durable backup or to move progress to another phone.</small>
 <label>First session date<input id="startDate" type="date" value="${esc(validDate(S.startDate)?S.startDate:defaultStart)}"></label>
 <div class="sc" style="margin-top:10px"><button id="ex">Export progress</button><button id="im">Import progress</button></div>
 <input id="progressFile" type="file" accept=".json,application/json" hidden>
 <button id="pr" style="width:100%;margin-top:8px">Print this page</button>
 <small style="margin-top:10px">To use: save this HTML file to your phone and open it in a browser. It works offline. To move progress, send the HTML and exported JSON file, then import the JSON on the other phone. Importing replaces the progress currently in this browser.</small></div>`;
 document.querySelectorAll("[data-k]").forEach(e=>e.onchange=()=>{S.inp[e.dataset.k]=e.value;save()});
 $("#startDate").onchange=e=>{if(!validDate(e.target.value))return;S.startDate=e.target.value;ses=makeSessions();cur=currentSession();save();inputs()};
 $("#ex").onclick=()=>{const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="skill-cycle-progress.json";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
 $("#im").onclick=()=>$("#progressFile").click();
 $("#progressFile").onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const x=JSON.parse(await file.text());if(!x||typeof x!="object"||Array.isArray(x)||!["startDate","inp","done","notes","res"].some(k=>k in x))throw Error();
  const clean={startDate:validDate(x.startDate)?x.startDate:defaultStart,inp:{M:"",b:"",bt:"A",ht:"1",rope:""},done:{},notes:{},res:{}};
  if(x.inp&&typeof x.inp=="object"){for(const k of["M","b","bt","ht","rope"])if(typeof x.inp[k]=="string")clean.inp[k]=x.inp[k];if(!["A","B","C"].includes(clean.inp.bt))clean.inp.bt="A";if(!["1","2","3"].includes(clean.inp.ht))clean.inp.ht="1"}
  for(const k of["done","notes","res"])if(x[k]&&typeof x[k]=="object"&&!Array.isArray(x[k]))for(const[key,val]of Object.entries(x[k]))if(/^(?:[1-9]|1[0-4])[FT]$/.test(key)||k=="res"&&/^([br][0-3])$/.test(key)){if(k=="done"&&typeof val=="boolean"||k!="done"&&typeof val=="string")clean[k][key]=val}
  S=clean;ses=makeSessions();cur=currentSession();save();draw()
 }catch(e){alert("That file isn't a valid Skill Cycle progress backup.")}finally{e.target.value=""}};
 $("#pr").onclick=()=>window.print()}
function results(){const n=["Double unders · Flight Simulator","Bar muscle-ups · AMRAP 5","Handstand walk · AMRAP 5","Rope climbs · 10 for time"],g=["Beat your time or add 10+ to M","+30–40% reps","+25% reps or distance","−15–20% time"];
 $("#v").innerHTML="<h1>Test results</h1>"+n.map((t,i)=>`<div class="card"><b>${t}</b><small>Goal: ${g[i]}</small><label>Baseline<input data-r="b${i}" value="${esc(S.res["b"+i]||"")}"></label><label>Retest<input data-r="r${i}" value="${esc(S.res["r"+i]||"")}"></label></div>`).join("");
 document.querySelectorAll("[data-r]").forEach(e=>e.oninput=()=>{S.res[e.dataset.r]=e.value;save()})}
let T={s:0,id:0};
function beep(){try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator();o.connect(a.destination);o.frequency.value=880;o.start();o.stop(a.currentTime+.18);navigator.vibrate&&navigator.vibrate(150)}catch(e){}}
function tick(){const m=+$("#tmin").value||10;T.s++;if(T.s%60==0)beep();
 if(T.s>=m*60){stop();$("#tl").textContent="Done";return}paint()}
function paint(){const m=+$("#tmin").value||10,r=60-T.s%60;$("#tc").textContent=String(Math.floor(T.s/60)).padStart(2,"0")+":"+String(T.s%60).padStart(2,"0");$("#tl").textContent=`Minute ${Math.floor(T.s/60)+1} of ${m} · ${r}s left`}
function stop(){clearInterval(T.id);T.id=0;$("#tgo").textContent="Start"}
$("#tgo").onclick=()=>{if(T.id){stop()}else{if(!T.s)beep();T.id=setInterval(tick,1000);$("#tgo").textContent="Pause";paint()}};
$("#trs").onclick=()=>{stop();T.s=0;$("#tc").textContent="00:00";$("#tl").textContent="Ready"};
draw();
</script></body></html>
